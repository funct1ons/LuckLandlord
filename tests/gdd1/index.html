<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>GDD1 F1 — offline foundation tests</title>
<body><h1>GDD1 F1 基础验证（不是F2游戏入口）</h1><pre id="summary">Running</pre><pre id="result"></pre>
<script src="../../js/gdd1/contract.js"></script><script src="../../js/gdd1/rng.js"></script>
<script src="../../js/gdd1/schema.js"></script><script src="../../js/gdd1/save.js"></script>
<script src="browser-data.js"></script><script src="foundation-tests.js"></script><script src="oracle-integrity.js"></script>
<script>
(function(){
  const F=window.GDD1;
  const cases=[...runGdd1FoundationTests(),...runGdd1OracleIntegrityTests()];
  const readMode=new URL(location.href).searchParams.get('storage')==='read';
  try{
    const before=F.readLegacy(localStorage).map(x=>[x.key,x.text]);
    const expected=F.createFoundationState('F1-GOLDEN');expected.cash=11;expected.revision=1;
    F.STREAMS.forEach(name=>F.nextUint32(expected.rng,name));
    if(!readMode){const stored=F.store(localStorage,expected);if(!stored.ok)throw Error(stored.error);}
    const result=F.load(localStorage,'slice-abd-v1');
    if(!result.ok || JSON.stringify(result.state)!==JSON.stringify(expected))throw Error('real storage roundtrip differs');
    const legacyAfter=F.readLegacy(localStorage).map(x=>[x.key,x.text]);
    if(JSON.stringify(before)!==JSON.stringify(legacyAfter))throw Error('legacy bytes changed');
    const vector=GDD1_TEST_VECTORS.vectors[0];
    F.STREAMS.forEach(name=>{if(F.nextUint32(result.state.rng,name)!==vector.streams[name].values[1])throw Error('continuation '+name);});
    cases.push({name:'gdd1/f1/browser-storage/'+(readMode?'reload-read':'write-read'),ok:true});
  }catch(e){cases.push({name:'gdd1/f1/browser-storage/'+(readMode?'reload-read':'write-read'),ok:false,error:e.message});}
  const result={scope:'F1 foundation only; no resolver/F2 gameplay acceptance',total:cases.length,passed:cases.filter(x=>x.ok).length,cases};
  document.getElementById('summary').textContent=result.passed+'/'+result.total;
  document.getElementById('result').textContent=JSON.stringify(result);
  document.body.dataset.done='true';document.body.dataset.passed=String(result.passed===result.total);
})();
</script></body></html>
