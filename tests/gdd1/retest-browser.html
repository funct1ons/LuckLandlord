<!doctype html><html><meta charset="utf-8"><title>GDD1 F1 independent retest</title><body><pre id="result">running</pre>
<script src="../../js/gdd1/contract.js"></script><script src="../../js/gdd1/rng.js"></script><script src="../../js/gdd1/schema.js"></script><script src="../../js/gdd1/save.js"></script><script src="browser-data.js"></script><script src="foundation-tests.js"></script><script src="oracle-integrity.js"></script><script src="fix-checks.js"></script><script src="retest-checks.js"></script>
<script>(async()=>{const baseline=[...runGdd1FoundationTests(),...runGdd1OracleIntegrityTests()],fixRegression=await runGdd1FixTests(),retest=await runGdd1Retest(),mode=new URL(location.href).searchParams.get('mode')||'write';const s=GDD1.createFoundationState('F1-RETEST-EDGE','full-v1');for(const n of GDD1.STREAMS)GDD1.nextUint32(s.rng,n);const legacy=['legacy-file-bytes','legacy-backup-bytes'];let storage={mode,ok:false};try{if(mode==='write'){GDD1.LEGACY_KEYS.forEach((k,i)=>localStorage.setItem(k,legacy[i]));if(!GDD1.store(localStorage,s).ok)throw Error('store failed')}const loaded=GDD1.load(localStorage,'full-v1');if(!loaded.ok||JSON.stringify(loaded.state)!==JSON.stringify(s))throw Error('state mismatch');if(JSON.stringify(GDD1.readLegacy(localStorage).map(x=>x.text))!==JSON.stringify(legacy))throw Error('legacy changed');for(const n of GDD1.STREAMS)if(GDD1.nextUint32(s.rng,n)!==GDD1.nextUint32(loaded.state.rng,n))throw Error('stream continuation');storage={mode,ok:true,legacyPreserved:true,fiveStreamContinuation:true};}catch(e){storage.error=e.message}const cases=[...baseline,...fixRegression.cases,...retest.cases],out={total:cases.length,passed:cases.filter(x=>x.ok).length,cases,storage,protocol:location.protocol,userAgent:navigator.userAgent};document.getElementById('result').textContent=JSON.stringify(out);document.body.dataset.done='true';document.body.dataset.passed=String(out.passed===out.total&&storage.ok)})().catch(e=>{document.getElementById('result').textContent=e.stack;document.body.dataset.done='error'})</script></body></html>
