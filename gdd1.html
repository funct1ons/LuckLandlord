<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112326"><title>雾港回收工坊</title><link rel="stylesheet" href="css/gdd1.css"></head>
<body><div id="room-scene" aria-hidden="true"></div><header><div class="brand"><span class="brand-mark" aria-hidden="true">◈</span><div><h1>雾港回收工坊</h1><small id="profile-summary">完整模式 / 精简模式（试验）</small></div></div><div id="stats" class="stats" aria-label="现金与待入账"></div><nav class="session" aria-label="工坊菜单"><button id="menu">开场</button><button type="button" id="codex-open">图鉴</button><button type="button" id="help-open">帮助</button><button type="button" id="settings-open">设置</button><details class="dev-tools"><summary>存档与工具</summary><div class="dev-controls"><label>Seed <input id="seed" value="FOG-F2" maxlength="1024"></label><button id="new">新精简模式</button><button id="new-full">新完整模式</button><button id="continue">继续精简模式</button><button id="continue-full">继续完整模式</button><button id="save">存档</button><button id="export">导出</button><button id="export-error" disabled>导出错误</button><label class="file-button">导入<input id="import" type="file" accept=".json,application/json"></label><label><input id="autosave" type="checkbox" checked> 自动保存</label><label><input id="audio-on" type="checkbox" checked> 音效</label><input id="audio-vol" type="range" min="0" max="1" step="0.05" value="0.65" title="音量" aria-label="音量" style="width:74px;vertical-align:middle"><select id="anim-speed" aria-label="演出速度" title="演出速度"><option value="normal">正常</option><option value="fast">快速</option><option value="instant">即时</option></select></div></details></nav></header>
<div id="notice" role="status" aria-live="polite"></div>
<div id="welcome" hidden></div>
<div id="coach" hidden></div>
<div id="overlay-root"></div>
<main><section class="bill-station" aria-label="账单与操作券"><div class="station-caption">本期账单</div><div id="bill"></div><p class="bill-footnote">每期截止前付清<br>十期之后，工坊留下。</p><div id="tickets" class="ticket-wallet"></div><p class="station-note">材料随机上盘<br>组合由你选择</p></section><section class="workspace"><div class="machine"><div id="machine-scene" aria-hidden="true"></div><div class="machine-label"><span><i class="pilot-light"></i> 雾港 · 回收机 07</span><span>五列 / 四行</span></div><div id="board" class="board" aria-label="5列4行运行盘"></div><div id="decision" class="decision"></div></div><section class="ledger"><h2>本轮账本</h2><div id="summary"></div><details><summary>逐格收入与因果日志</summary><div id="ledger"></div><div id="log" hidden></div></details></section></section><aside class="build-cabinet"><div class="cabinet-caption">工坊构筑柜</div><div class="cabinet-tabs" role="tablist" aria-label="构筑内容"><button id="tab-pool" type="button" role="tab" aria-selected="true" aria-controls="pool-panel">生产牌库 <span id="pool-count"></span></button><button id="tab-items" type="button" role="tab" aria-selected="false" aria-controls="items-panel">本局升级 <span id="items-count"></span></button></div><section id="pool-panel" role="tabpanel" aria-labelledby="tab-pool"><p class="cabinet-hint">查阅每张材料、设备与帮手</p><div id="pool" class="pool"></div></section><section id="items-panel" role="tabpanel" aria-labelledby="tab-items" hidden><h2>本局升级 / 临时效果</h2><div id="items"></div></section><details class="legacy-detail"><summary>旧局只读摘要</summary><div id="legacy"></div></details></aside></main>
<script src="js/gdd1/contract.js"></script><script src="js/gdd1/rng.js"></script><script src="js/gdd1/schema.js"></script><script src="js/gdd1/save.js"></script><script src="js/gdd1/full-save.js"></script><script src="js/gdd1/content.js"></script><script src="js/gdd1/full-content.js"></script><script src="js/gdd1/full-effects.js"></script><script src="js/gdd1/descriptions.js"></script><script src="js/gdd1/offers.js"></script><script src="js/gdd1/resolver.js"></script><script src="js/gdd1/controller.js"></script><script src="js/gdd1/full-controller.js"></script><script src="js/gdd1UI/icons.js"></script><script src="js/gdd1UI/audio.js"></script><script src="js/gdd1UI/anim.js"></script><script src="js/gdd1UI/copy.js"></script><script src="js/gdd1UI/prefs.js"></script><script src="js/gdd1UI/overlay.js"></script><script src="js/gdd1UI/confirm.js"></script><script src="js/gdd1UI/playerText.js"></script><script src="js/gdd1UI/details.js"></script><script src="js/gdd1UI/codex.js"></script><script src="js/gdd1UI/tutorial.js"></script><script src="js/gdd1UI/scene.js"></script><script src="js/gdd1UI/help.js"></script><script src="js/gdd1UI/logView.js"></script><script src="js/gdd1UI/end.js"></script><script src="js/gdd1UI/settings.js"></script><script src="js/gdd1UI/keys.js"></script><script src="js/gdd1UI/main.js"></script></body></html>
